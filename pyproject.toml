[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matyos"
dynamic = ["version"]
description = "MatyOS — a dependently-typed, LLM-native proof assistant with a discovery engine"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Ahmed Hafdi", email = "58536023+HAFDIAHMED@users.noreply.github.com"}
]
maintainers = [
    {name = "Ahmed Hafdi", email = "58536023+HAFDIAHMED@users.noreply.github.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["proof-assistant", "dependent-types", "theorem-prover", "mathematics", "discovery", "mcp", "llm"]
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "pre-commit>=2.0",
    "isort>=5.0",
]
docs = [
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
    "myst-parser>=0.17",
    "sphinx-copybutton>=0.5",
]
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "coverage>=6.0",
]
discovery = [
    "mpmath>=1.3",   # PSLQ integer-relation detection for the v2 discovery engine
]
mcp = [
    "mpmath>=1.3",   # discovery tools rely on PSLQ
    "mcp>=1.0",      # Model Context Protocol server (Python 3.10+)
]

[project.scripts]
matyos = "matyos.cli:main"
matyos-mcp = "matyos.mcp_server:run"

[project.urls]
Homepage = "https://github.com/MatyOS-Project/MatyOS"
Documentation = "https://github.com/MatyOS-Project/MatyOS/tree/main/docs"
Repository = "https://github.com/MatyOS-Project/MatyOS"
"Bug Tracker" = "https://github.com/MatyOS-Project/MatyOS/issues"

[tool.setuptools.dynamic]
version = {attr = "matyos.__version__"}

# Publish only the MatyOS proof assistant. The legacy "El" language
# (compiler/ utils/ system/ el_*.py) is not part of this distribution.
# Note: the stdlib/ .elk files live outside the package and are not bundled yet;
# `matyos check stdlib/...` works from a checkout, not from a bare pip install.
[tool.setuptools.packages.find]
include = ["matyos*"]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = [
    "--strict-markers",
    "--cov=matyos",
    "--cov=compiler",
    "--cov=utils",
    "--cov=system",
    "--cov-report=term-missing",
]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

[tool.coverage.run]
branch = true
source = ["matyos", "compiler", "utils", "system"]
omit = [
    "*/tests/*",
    "*/test_*",
    "setup.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "dist",
    "build",
    "*.egg-info",
]
